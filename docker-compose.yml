services:

  postgres:
    image: postgres:16
    container_name: prefect-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prefect

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d prefect"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api

    command:
      - prefect
      - server
      - start
      - --host
      - 0.0.0.0

    ports:
      - "4200:4200"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s


  prefect-setup:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: prefect-setup

    depends_on:
      prefect-server:
        condition: service_healthy

    environment:
      PREFECT_API_URL: http://prefect-server:4200/api

    command:
      - sh
      - -c
      - |
        echo "Creating work pool..."

        prefect work-pool inspect default-pool ||
        prefect work-pool create default-pool --type process

        echo "Creating deployment..."

        python -u /app/deploy_flows.py

        echo "Setup completed."

    restart: "no"


  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: prefect-worker

    depends_on:
      prefect-setup:
        condition: service_completed_successfully

    environment:
      PREFECT_API_URL: http://prefect-server:4200/api

    volumes:
      - ./app:/app/app

    command:
      - prefect
      - worker
      - start
      - --pool
      - default-pool

    restart: unless-stopped


volumes:
  postgres_data: